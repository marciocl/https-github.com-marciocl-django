{% extends "polls/base.html" %}

{% block title %}{{ question.question_text }}{% endblock %}

{% block content %}
<div class="bg-white border border-slate-200 rounded-xl shadow-sm p-6 sm:p-8">
  <h1 class="text-2xl font-bold text-slate-900 mb-6">{{ question.question_text }}</h1>

  {% if error_message %}
    <div class="mb-5 p-3.5 bg-rose-50 border border-rose-200 text-rose-700 text-sm rounded-lg font-medium">
      {{ error_message }}
    </div>
  {% endif %}

  <form action="{% url 'polls:vote' question.id %}" method="post" class="space-y-3">
    {% csrf_token %}
    {% for choice in question.choices.all %}
      <label class="flex items-center p-3.5 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50 transition group">
       <input type="radio" name="choice" id="choice{{ forloop.counter }}" value="{{ choice.id }}">
               class="w-4 h-4 text-indigo-600 focus:ring-indigo-500 border-slate-300">
        <span class="ml-3 text-slate-700 font-medium group-hover:text-slate-900">{{ choice.choice_text }}</span>
      </label>
    {% endfor %}

    <div class="pt-4 flex items-center justify-between">
      <a href="{% url 'polls:index' %}" class="text-sm font-medium text-slate-500 hover:text-slate-800">
        ← Voltar
      </a>
      <button type="submit" 
              class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-lg shadow-sm transition">
        Confirmar Voto
      </button>
    </div>
  </form>
</div>
{% endblock %}
